name: waap-security-gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST
        run: python -m pip install semgrep && semgrep --config=p/owasp-top-ten app/ waap --error
      - name: SCA
        run: python -m pip install pip-audit && pip-audit -r app/requirements.txt
      - name: Build image
        run: docker build -t waap-lab/app:${{ github.sha }} app/
