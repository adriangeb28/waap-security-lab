services:
  lab-app:
    build: ./app
    environment:
      RASP_ENABLED: "1"
    expose:
      - "5000"
    networks: [security-lab]
    restart: unless-stopped

  waap:
    image: owasp/modsecurity-crs:nginx
    environment:
      BACKEND: http://lab-app:5000
      PORT : "8080"
    ParANOIA: "${PARANOIA:-1}"
    ports:
      - "${WAAP_PORT:-8081}:8080"
    depends_on:
      - lab-app
    networks: [security-lab]
    restart: unless-stopped

nnetworks:
  security-lab:
    driver: bridge
